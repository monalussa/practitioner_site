# Easy!Appointments booking subdomain — Docker option
# Use this when EA runs in Docker (docker compose up) on port 9090.
# See nginx-booking.conf for the native PHP-FPM alternative.

server {
    listen 80;
    server_name book.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name book.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/book.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 5M;

    location / {
        proxy_pass         http://127.0.0.1:9090;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
