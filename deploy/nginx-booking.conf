# DEPRECATED — this config is for native PHP-FPM deployment.
# The project now uses Docker for Easy!Appointments.
# Use deploy/nginx-booking-docker.conf instead.
#
# Easy!Appointments booking subdomain (native PHP-FPM)
# PHP-FPM must be running: sudo systemctl enable php8.2-fpm

server {
    listen 80;
    server_name book.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name book.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/book.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    root /var/www/easyappointments;
    index index.php index.html;

    client_max_body_size 5M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }
}
